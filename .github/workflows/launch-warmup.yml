name: Launch warm-up

# One-off for the LinkedIn launch post (3 November 2026, 14:00 UTC). The dungeon runs on Render's free plan,
# which sleeps after 15 minutes without visitors; this keeps it awake from shortly before the post until
# 18:00 UTC, so people arriving from the post don't land on a "waking up" screen. Delete it after the launch.
on:
  schedule:
    # GitHub can start scheduled runs late, so start well before the post.
    - cron: "15 13 3 11 *"
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Keep the dungeon awake until 18:00 UTC
        run: |
          # The cron above would also fire on 3 November in later years; only run on launch day,
          # unless started by hand.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%F)" != "2026-11-03" ]; then
            echo "Not launch day; nothing to do."
            exit 0
          fi
          until [ "$(date -u +%H%M)" -ge 1800 ]; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 https://playwright-dungeon-crawl.onrender.com/health || echo "000")
            echo "$(date -u +%H:%M:%S) /health -> $status"
            sleep 240
          done
          echo "Past 18:00 UTC; done."
